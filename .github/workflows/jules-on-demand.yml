name: Jules PR Review Trigger

on:
  pull_request:
    types: [labeled]

jobs:
  jules_review:
    if: github.event.label.name == 'jules-review'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jules Review
        run: |
          echo "Triggering Jules for PR #${{ github.event.pull_request.number }}"
          # Hier wird Jules über die API oder das installierte GitHub App Interface aktiv.
          # Da Jules als GitHub App läuft, erkennt er das Label-Event automatisch,
          # sofern die App-Berechtigungen korrekt gesetzt sind.
